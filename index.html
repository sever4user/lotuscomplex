<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTUSCOMPLEX // SYSTEM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="terminal-overlay"></div>

    <div class="container">
        <header>
            <h1>LOTUSCOMPLEX</h1>
            <div class="system-ver">SYSTEM_v.1.0 // PROJECT SEVER</div>
        </header>

        <nav class="system-nav">
            <button onclick="showSection('logs')">[ LOGS ]</button>
            <button onclick="showSection('music')">[ MUSIC ]</button>
            <button onclick="showSection('visuals')">[ VISUALS ]</button>
            <button onclick="showSection('contacts')">[ CONTACTS ]</button>
        </nav>

        <div id="status-line" class="system-status">STATUS: ONLINE // SECTION: LOGS</div>

        <main>
            <section id="logs-section" class="content-section active">
                <div id="typewriter-logs" class="terminal-text"></div>
            </section>

            <section id="music-section" class="content-section">
                <div id="playlist"></div>
            </section>

            <section id="visuals-section" class="content-section">
                <div class="gallery-grid">
                    </div>
            </section>
            
            <section id="contacts-section" class="content-section">
                <div class="terminal-text">
                > УСТАНОВКА СОЕДИНЕНИЯ...
                > КАНАЛ СВЯЗИ ОТКРЫТ.

                TG: @твой_ник
                MAIL: contact@sever.com
                STATUS: WAITING_FOR_RESPONSE...
                    </div>
            </section>
        </main>
    </div>

    <div id="overlay-bg"></div>

    <script src="script.js"></script>
</body>
</html>
