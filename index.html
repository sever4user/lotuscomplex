<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotuscomplex | Музыка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>LOTUSCOMPLEX</h1>
        <p>Listen only</p>

        <div class="track-list">
    <div class="track-card">
        <div class="track-info">
            <span class="track-name">PROJECT SEVER - CORE</span>
            <input type="range" class="seek-bar" id="seek1" value="0" step="0.1">
        </div>
        <audio id="audio1" src="audio/track1.mp3" controlsList="nodownload"></audio>
        <div class="btns">
            <button onclick="playTrack('audio1', 'seek1')">PLAY</button>
            <button onclick="pauseTrack('audio1')">STOP</button>
        </div>
    </div>

    <div class="track-card">
        <div class="track-info">
            <span class="track-name">CONCRETE DREAMS</span>
            <input type="range" class="seek-bar" id="seek2" value="0" step="0.1">
        </div>
        <audio id="audio2" src="audio/track2.mp3" controlsList="nodownload"></audio>
        <div class="btns">
            <button onclick="playTrack('audio2', 'seek2')">PLAY</button>
            <button onclick="pauseTrack('audio2')">STOP</button>
        </div>
    </div>
</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
