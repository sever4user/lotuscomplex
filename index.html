<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotuscomplex | Музыка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>LOTUSCOMPLEX</h1>
        <p>Listen only</p>

        <div class="track-list">
            <div class="track-card">
                <span class="track-name">Track 01</span>
                <audio id="audio1" src="audio/track1.mp3" controlsList="nodownload" oncontextmenu="return false;"></audio>
                <button onclick="playTrack('audio1')">PLAY</button>
                <button onclick="pauseTrack('audio1')">STOP</button>
            </div>
            
            </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
