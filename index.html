<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="sever4user - artist, experimental electronics">
  <meta name="theme-color" content="#14171a">
  <title>sever4user</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scan-overlay" aria-hidden="true"></div>
  <div class="pulse-noise" aria-hidden="true"></div>
  <pre id="asciiVines" class="ascii-vines" aria-hidden="true"></pre>

  <div class="page">
    <header class="project-header">
      <h1>sever4user</h1>
      <p class="subtitle">ARTIST // EXPERIMENTAL ELECTRONICS</p>
    </header>

    <nav class="tabs" aria-label="Sections">
      <button class="tab active" data-section="logs">[ LOGS ]</button>
      <button class="tab" data-section="music">[ MUSIC ]</button>
      <button class="tab" data-section="visuals">[ VISUALS ]</button>
      <button class="tab" data-section="contacts">[ CONTACTS ]</button>
    </nav>

    <!-- Music Sub-tabs -->
    <nav id="musicTabs" class="music-sub-tabs" aria-label="Music categories" style="display: none;">
      <button class="music-tab active" data-category="soundtracks">[ SOUNDTRACKS ]</button>
      <button class="music-tab" data-category="own">[ MY OWN MUSIC ]</button>
    </nav>

    <!-- Soundtracks Sub-categories -->
    <nav id="soundtrackTabs" class="soundtrack-sub-tabs" aria-label="Soundtrack categories" style="display: none;">
      <button class="soundtrack-tab active" data-category="kletka">[ KLETKA ]</button>
      <button class="soundtrack-tab" data-category="privet">[ PRIVET ]</button>
      <button class="soundtrack-tab" data-category="lights">[ AS THE LIGHTS FADE AWAY ]</button>
      <button class="soundtrack-tab" data-category="mystuff">[ MY STUFF ]</button>
    </nav>

    <div class="status-wrap">
      <p id="statusLine" class="status-line">STATUS: ONLINE // SECTION: LOGS</p>
      <div class="master-volume-shell">
        <button id="masterVolumeBtn" class="sfx-toggle master-volume-btn" type="button" aria-label="Master SFX volume">
          VOLUME
        </button>
        <div class="master-volume-pop">
          <input id="masterVolumeRange" class="volume-range" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Master SFX volume">
        </div>
      </div>
      <button id="sfxToggle" class="sfx-toggle" type="button" aria-pressed="false">SFX: OFF</button>
    </div>

    <main>
      <section id="logs" class="panel active" aria-live="polite">
        <div id="logsTypewriter" class="terminal-text"></div>
      </section>

      <section id="music" class="panel">
        <div id="musicTabsContainer">
          <!-- Soundtracks Section -->
          <div id="soundtracksSection">
            <div id="soundtrackCategoryList" class="music-list"></div>
          </div>
          
          <!-- My Own Music Section -->
          <div id="ownMusicSection" style="display: none;">
            <div id="ownMusicGrid" class="own-music-grid"></div>
          </div>
        </div>
      </section>

      <section id="visuals" class="panel">
        <div id="visualGrid" class="visual-grid"></div>
      </section>

      <section id="contacts" class="panel">
        <div id="contactsTypewriter" class="terminal-text"></div>
      </section>
    </main>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLightbox" class="close-lightbox" aria-label="Close">[X]</button>
    <img id="lightboxImage" alt="Fullscreen artwork">
  </div>

  <script src="script.js"></script>
</body>
</html>
