<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sever4user</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="ascii-vines" id="asciiVines"></div>
  <div class="scan-overlay"></div>
  <div class="pulse-noise"></div>

  <div class="page">
    <header class="project-header">
      <h1>sever4user</h1>
      <p class="subtitle">ARTIST // EXPERIMENTAL ELECTRONICS</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-section="logs">[ LOGS ]</button>
      <button class="tab" data-section="music">[ MUSIC ]</button>
      <button class="tab" data-section="visuals">[ VISUALS ]</button>
      <button class="tab" data-section="contacts">[ CONTACTS ]</button>
    </nav>

    <div class="status-wrap">
      <p id="statusLine" class="status-line">STATUS: ONLINE // SECTION: LOGS</p>
      <div class="audio-controls">
        <button id="sfxToggle" class="sfx-toggle" aria-pressed="false">SFX: OFF</button>
        <div class="master-volume-shell">
          <button class="tab master-volume-btn" aria-label="Volume Control">VOLUME</button>
          <div class="master-volume-pop">
            <input id="masterVolumeRange" class="volume-range" type="range" min="0" max="1" step="0.01" value="0.62">
          </div>
        </div>
      </div>
    </div>

    <!-- LOGS PANEL -->
    <section id="logsPanel" class="panel active">
      <div id="logsSubTabs" class="music-sub-tabs" style="display:none;">
        <button class="music-tab active" data-logs-tab="about">ABOUT ME</button>
        <button class="music-tab" data-logs-tab="projects">PROJECTS</button>
      </div>
      <div id="aboutContent" class="logs-tab-content active">
        <p id="logsTypewriter" class="terminal-text"></p>
      </div>
      <div id="projectsContent" class="logs-tab-content" style="display:none;">
        <div id="projectsGrid" class="own-music-grid"></div>
      </div>
    </section>

    <!-- MUSIC PANEL -->
    <section id="musicPanel" class="panel">
      <div id="musicTabs" class="music-sub-tabs">
        <button class="music-tab active" data-category="soundtracks">SOUNDTRACKS</button>
        <button class="music-tab" data-category="ownmusic">MY OWN MUSIC</button>
      </div>
      <div id="soundtracksSection">
        <div id="soundtrackDropdowns"></div>
      </div>
      <div id="ownMusicSection" style="display:none;">
        <div id="ownMusicGrid" class="own-music-grid"></div>
      </div>
    </section>

    <!-- VISUALS PANEL -->
    <section id="visualsPanel" class="panel">
      <div id="visualGrid" class="visual-grid"></div>
    </section>

    <!-- CONTACTS PANEL -->
    <section id="contactsPanel" class="panel">
      <p id="contactsTypewriter" class="terminal-text"></p>
    </section>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button id="closeLightbox" class="close-lightbox">[ CLOSE ]</button>
    <img id="lightboxImage" src="" alt="Preview">
  </div>

  <script src="script.js"></script>
</body>
</html>
