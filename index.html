<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOTUSCOMPLEX | TERMINAL</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-overlay"></div>
    <div class="container">
        <header>
            <h1>LOTUSCOMPLEX</h1>
            <div class="system-line">
                <span>SYSTEM_v.1.0 //</span>
                <nav class="system-nav">
                    <button onclick="showSection('logs')">[ LOGS ]</button>
                    <button onclick="showSection('music')">[ MUSIC ]</button>
                    <button onclick="showSection('visuals')">[ VISUALS ]</button>
                    <button onclick="showSection('contacts')">[ CONTACTS ]</button>
                </nav>
            </div>
            <div class="system-status" id="status-line">STATUS: ONLINE // SECTION: LOGS</div>
        </header>

        <section id="music-section" class="content-section active">
            <div id="playlist"></div>
        </section>

        <section id="logs-section" class="content-section">
            <div class="terminal-text" id="typewriter-logs">
                </div>
        </section>

        <section id="visuals-section" class="content-section">
            <div class="gallery-grid">
                </div>
        </section>

        <section id="contacts-section" class="content-section">
            <div class="terminal-text">
                <p>> СВЯЗЬ С ОПЕРАТОРОМ:</p>
                <p>TG: @YOUR_NICKNAME</p>
                <p>MAIL: SEVER.PROJECT@NODE.SYS</p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
